# =============================================================================
# Langfuse Helm values —「方案 C」不允許 CRD 的環境
#   ClickHouse 用 Bitnami chart 獨立部署（純 StatefulSet + Keeper，不需要 CRD）
#   Langfuse chart 以 clickhouse.deploy=false 指向 Bitnami CH
#
# 其他 store 一樣外接：
#   - PostgreSQL:  Bitnami postgresql-ha (pgpool)
#   - Redis:       Bitnami redis (sentinel mode)
#   - S3:          MinIO
#
# 前置條件：
#   1. 建立密碼 Secret：
#        kubectl create secret generic langfuse-external-secrets -n <namespace> \
#          --from-literal=postgres-password='...' \
#          --from-literal=redis-password='...' \
#          --from-literal=sentinel-password='...' \
#          --from-literal=clickhouse-password='...' \
#          --from-literal=minio-access-key='...' \
#          --from-literal=minio-secret-key='...'
#
#   2. 部署 Bitnami ClickHouse（參考 bitnami-clickhouse-values.yaml）：
#        helm install clickhouse oci://registry-1.docker.io/bitnamicharts/clickhouse \
#          -n data -f bitnami-clickhouse-values.yaml
#      ⚠️ Bitnami 已將多數 chart 轉為 legacy，image 請 pin tag，未來自行維護升級。
#
#   3. helm install langfuse . -n <namespace> -f values-with-bitnami-clickhouse.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Langfuse 核心
# -----------------------------------------------------------------------------
langfuse:
  logging:
    level: info
    format: json

  salt:
    value: ""
  encryptionKey:
    value: ""

  nextauth:
    url: https://langfuse.example.com
    secret:
      value: ""

  features:
    telemetryEnabled: true
    signUpDisabled: false

  nodeEnv: production
  replicas: 2

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: langfuse.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: langfuse-tls

  web:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { memory: 2Gi }

  worker:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { memory: 2Gi }

# -----------------------------------------------------------------------------
# 1. PostgreSQL HA
# -----------------------------------------------------------------------------
postgresql:
  deploy: false
  host: langfuse-pg-postgresql-ha-pgpool.data.svc.cluster.local
  port: 5432

  # pgpool 的 prepared statement 快取偶爾會卡住 Prisma migration。若 migration
  # 卡住或報 "prepared statement already exists" 之類的錯誤，把 directUrl 指到
  # primary Service（bypass pgpool）即可：
  # directUrl: "postgresql://langfuse:<pw>@langfuse-pg-postgresql-ha-postgresql:5432/langfuse"
  directUrl: ""

  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-external-secrets
    secretKeys:
      userPasswordKey: postgres-password
  migration:
    autoMigrate: true

# -----------------------------------------------------------------------------
# 2. Redis Sentinel
# -----------------------------------------------------------------------------
# 實際部署狀態（見 bitnami-redis-sentinel-values.yaml）：
#   helm install langfuse-redis oci://registry-1.docker.io/bitnamicharts/redis \
#     -n dev -f bitnami-redis-sentinel-values.yaml
#   → release=langfuse-redis, namespace=dev, 3 個 node（架構=replication+sentinel）
#
#   密碼：Bitnami chart 自動產生，存在 Secret/langfuse-redis 的 redis-password
#   這個 key。這個 chart 版本沒有獨立的 sentinel 密碼，auth.sentinel: true 只是
#   讓 Sentinel port(26379) 也套用同一組密碼，所以下面 sentinel.existingSecret
#   跟 auth.existingSecret 指向同一個 Secret/同一個 key。
redis:
  deploy: false
  sentinel:
    enabled: true
    masterName: mymaster
    nodes: "langfuse-redis-node-0.langfuse-redis-headless.dev.svc.cluster.local:26379,langfuse-redis-node-1.langfuse-redis-headless.dev.svc.cluster.local:26379,langfuse-redis-node-2.langfuse-redis-headless.dev.svc.cluster.local:26379"
    existingSecret: langfuse-redis
    existingSecretPasswordKey: redis-password
  auth:
    username: default
    existingSecret: langfuse-redis
    existingSecretPasswordKey: redis-password
    database: 0

  tls:
    enabled: false
    # caPath: /certs/ca.crt
    # certPath: /certs/tls.crt
    # keyPath: /certs/tls.key

# -----------------------------------------------------------------------------
# 3. ClickHouse — 外接 Bitnami ClickHouse
#
#   Bitnami chart 產生的 Service 名稱：
#     <release>-clickhouse.<namespace>.svc.cluster.local           (headless)
#     <release>-clickhouse-shard0-0.<release>-clickhouse-headless (pod DNS)
#
#   若你用 shard=1、replicaCount=2，Langfuse 直接指到 headless 即可。
# -----------------------------------------------------------------------------
clickhouse:
  deploy: false
  # crdCheck 不用特別設：這個檢查只在 clickhouse.deploy=true 時才會跑
  # （見 templates/validations.yaml），deploy=false 這裡已經自動跳過。

  # release name = clickhouse、namespace = data 時的 headless service DNS
  host: clickhouse.data.svc.cluster.local
  httpPort: 8123
  nativePort: 9000
  database: default

  # ⭐ 若 Bitnami CH 部署為多副本 + Keeper（真正的 cluster），這裡開 true。
  #    如果只是單機（Bitnami 的 shards=1 & replicaCount=1），這裡必須 false，
  #    否則 Langfuse 會下 ON CLUSTER DDL 而失敗。
  cluster:
    enabled: true

  auth:
    username: default
    existingSecret: langfuse-external-secrets
    existingSecretKey: clickhouse-password

  migration:
    autoMigrate: true
    ssl: false

# -----------------------------------------------------------------------------
# 4. MinIO（S3 相容）
#
#   實際部署狀態（見 bitnami-minio-values.yaml）：
#     helm install langfuse-minio oci://registry-1.docker.io/bitnamicharts/minio \
#       -n dev -f bitnami-minio-values.yaml
#     → release=langfuse-minio, namespace=dev, mode=standalone
#
#   帳密：chart 自動產生，存在 Secret/langfuse-minio 的 root-user / root-password
#   這兩個 key。standalone 模式沒有另外開 dedicated IAM user，root 帳密本身
#   就是 Langfuse 要用的 access key / secret key。
#
#   三個 bucket（langfuse-events / -exports / -media）已經用 chart 的
#   defaultBuckets 在啟動時自動建好，不用再手動建。
# -----------------------------------------------------------------------------
s3:
  deploy: false
  storageProvider: s3

  endpoint: "http://langfuse-minio.dev.svc.cluster.local:9000"
  region: "us-east-1"
  forcePathStyle: true
  bucket: langfuse

  accessKeyId:
    secretKeyRef:
      name: langfuse-minio
      key: root-user
  secretAccessKey:
    secretKeyRef:
      name: langfuse-minio
      key: root-password

  eventUpload:
    bucket: langfuse-events
  batchExport:
    enabled: true
    bucket: langfuse-exports
  mediaUpload:
    enabled: true
    bucket: langfuse-media
    maxContentLength: 1000000000
    downloadUrlExpirySeconds: 3600
