# =============================================================================
# Langfuse Helm values —「方案 C」不允許 CRD 的環境
#   ClickHouse 用 Bitnami chart 獨立部署（純 StatefulSet + Keeper，不需要 CRD）
#   Langfuse chart 以 clickhouse.deploy=false 指向 Bitnami CH
#
# 全部四個外接 store 都已經實際部署在 dev namespace 並驗證過（不是規劃階段的
# 占位設定），細節見各自的 bitnami-*-values.yaml 開頭註解：
#   - PostgreSQL:  release postgresql-ha（非本輪部署，沿用既有的）
#   - Redis:       release langfuse-redis（bitnami-redis-sentinel-values.yaml）
#   - MinIO:       release langfuse-minio（bitnami-minio-values.yaml）
#   - ClickHouse:  release langfuse-clickhouse（bitnami-clickhouse-values.yaml）
#
# 密碼一律讓各自的 chart 自動產生、存進各自的 Secret（見下面每個 section 的
# existingSecret/existingSecretKey）。最早規劃階段設想的共用 Secret
# langfuse-external-secrets 從來沒有真的建立過，已經不是實際採用的做法。
#
# 安裝順序：
#   1. 部署 Redis/MinIO/ClickHouse（各自 bitnami-*-values.yaml 開頭有完整指令）
#   2. helm install langfuse . -n dev -f values-with-bitnami-clickhouse.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Langfuse 核心
# -----------------------------------------------------------------------------
langfuse:
  logging:
    level: info
    format: json

  salt:
    value: ""
  encryptionKey:
    value: ""

  nextauth:
    url: https://langfuse.example.com
    secret:
      value: ""

  features:
    telemetryEnabled: true
    signUpDisabled: false

  nodeEnv: production
  replicas: 2

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: langfuse.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: langfuse-tls

  web:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { memory: 2Gi }

  worker:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { memory: 2Gi }

# -----------------------------------------------------------------------------
# 1. PostgreSQL HA
# -----------------------------------------------------------------------------
# 實際部署狀態（見 bitnami-postgresql-ha-values.yaml）：
#   helm upgrade postgresql-ha oci://registry-1.docker.io/bitnamicharts/postgresql-ha \
#     --version 16.3.2 -n dev -f bitnami-postgresql-ha-values.yaml
#   → release=postgresql-ha, namespace=dev（非本輪部署，沿用既有 release，
#     這次只是幫它補上 Langfuse 專用的 role/database）
#
#   這個 release 原本是純 chart 預設值裝的，只有內建的 postgres 超級使用者，
#   沒有 Langfuse 專用帳號。已經手動建立：
#     CREATE ROLE langfuse WITH LOGIN PASSWORD '...';
#     CREATE DATABASE langfuse OWNER langfuse;
#   密碼存進 Secret/langfuse-postgresql-app 的 password key。
#
#   ⚠️ 只在資料庫端建好 role 還不夠：pgpool（Langfuse 實際連的那個 service）
#   自己維護一份獨立的 pool_passwd 密碼檔，只在 container 啟動時寫入
#   pgpool.postgresUsername（預設 postgres）這一個使用者。新建的 langfuse
#   role 要透過 pgpool.customUsersSecret 讓 chart 寫進 pool_passwd，不然會
#   `SCRAM authentication failed: pool_passwd file does not contain an
#   entry for "langfuse"`——細節見 bitnami-postgresql-ha-values.yaml。
postgresql:
  deploy: false
  host: postgresql-ha-pgpool.dev.svc.cluster.local
  port: 5432

  # pgpool 的 prepared statement 快取偶爾會卡住 Prisma migration。若 migration
  # 卡住或報 "prepared statement already exists" 之類的錯誤，把 directUrl 指到
  # primary Service（bypass pgpool）即可：
  # directUrl: "postgresql://langfuse:<pw>@postgresql-ha-postgresql.dev.svc.cluster.local:5432/langfuse"
  directUrl: ""

  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-postgresql-app
    secretKeys:
      userPasswordKey: password
  migration:
    autoMigrate: true

# -----------------------------------------------------------------------------
# 2. Redis Sentinel
# -----------------------------------------------------------------------------
# 實際部署狀態（見 bitnami-redis-sentinel-values.yaml）：
#   helm install langfuse-redis oci://registry-1.docker.io/bitnamicharts/redis \
#     -n dev -f bitnami-redis-sentinel-values.yaml
#   → release=langfuse-redis, namespace=dev, 3 個 node（架構=replication+sentinel）
#
#   密碼：Bitnami chart 自動產生，存在 Secret/langfuse-redis 的 redis-password
#   這個 key。這個 chart 版本沒有獨立的 sentinel 密碼，auth.sentinel: true 只是
#   讓 Sentinel port(26379) 也套用同一組密碼，所以下面 sentinel.existingSecret
#   跟 auth.existingSecret 指向同一個 Secret/同一個 key。
redis:
  deploy: false
  sentinel:
    enabled: true
    masterName: mymaster
    nodes: "langfuse-redis-node-0.langfuse-redis-headless.dev.svc.cluster.local:26379,langfuse-redis-node-1.langfuse-redis-headless.dev.svc.cluster.local:26379,langfuse-redis-node-2.langfuse-redis-headless.dev.svc.cluster.local:26379"
    existingSecret: langfuse-redis
    existingSecretPasswordKey: redis-password
  auth:
    username: default
    existingSecret: langfuse-redis
    existingSecretPasswordKey: redis-password
    database: 0

  tls:
    enabled: false
    # caPath: /certs/ca.crt
    # certPath: /certs/tls.crt
    # keyPath: /certs/tls.key

# -----------------------------------------------------------------------------
# 3. ClickHouse — 外接 Bitnami ClickHouse
#
#   實際部署狀態（見 bitnami-clickhouse-values.yaml）：
#     helm install langfuse-clickhouse oci://registry-1.docker.io/bitnamicharts/clickhouse \
#       --version 9.4.4 -n dev -f bitnami-clickhouse-values.yaml
#     → release=langfuse-clickhouse, namespace=dev, shards=1 replicaCount=2 + 3 keeper
#
#   帳密：chart 自動產生，存在 Secret/langfuse-clickhouse 的 admin-password
#   這個 key（不是 password，這裡容易猜錯——上次的草稿就猜錯過一次，這次是
#   直接從 dry-run 的 NOTES.txt 對出來的）。
#
#   ⭐ cluster.enabled=true 這件事已經在真實叢集上實測驗證過，不是用猜的：
#     - system.clusters 查得到 cluster 名稱確實是 "default"（Bitnami chart
#       的 clusterName 參數預設值）
#     - 用 ReplicatedMergeTree ON CLUSTER default 建表、從 shard0-0 寫入、
#       從 shard0-1 讀到；反過來從 shard0-1 寫、shard0-0 讀，兩個方向都通
#     這證實了之前review時擔心的風險：不是「兩份獨立 schema、沒有真正複製資料」，
#     是真的在做資料複製。
clickhouse:
  deploy: false
  host: langfuse-clickhouse.dev.svc.cluster.local
  httpPort: 8123
  nativePort: 9000
  database: default

  cluster:
    enabled: true

  auth:
    username: default
    existingSecret: langfuse-clickhouse
    existingSecretKey: admin-password

  migration:
    autoMigrate: true
    ssl: false

# -----------------------------------------------------------------------------
# 4. MinIO（S3 相容）
#
#   實際部署狀態（見 bitnami-minio-values.yaml）：
#     helm install langfuse-minio oci://registry-1.docker.io/bitnamicharts/minio \
#       -n dev -f bitnami-minio-values.yaml
#     → release=langfuse-minio, namespace=dev, mode=standalone
#
#   帳密：chart 自動產生，存在 Secret/langfuse-minio 的 root-user / root-password
#   這兩個 key。standalone 模式沒有另外開 dedicated IAM user，root 帳密本身
#   就是 Langfuse 要用的 access key / secret key。
#
#   三個 bucket（langfuse-events / -exports / -media）已經用 chart 的
#   defaultBuckets 在啟動時自動建好，不用再手動建。
# -----------------------------------------------------------------------------
s3:
  deploy: false
  storageProvider: s3

  endpoint: "http://langfuse-minio.dev.svc.cluster.local:9000"
  region: "us-east-1"
  forcePathStyle: true
  bucket: langfuse

  accessKeyId:
    secretKeyRef:
      name: langfuse-minio
      key: root-user
  secretAccessKey:
    secretKeyRef:
      name: langfuse-minio
      key: root-password

  eventUpload:
    bucket: langfuse-events
  batchExport:
    enabled: true
    bucket: langfuse-exports
  mediaUpload:
    enabled: true
    bucket: langfuse-media
    maxContentLength: 1000000000
    downloadUrlExpirySeconds: 3600
