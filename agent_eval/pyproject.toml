[project]
name = "agent-eval"
version = "0.1.0"
description = "Golden-set extraction and pre-release simulation testing for Langfuse-instrumented agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langfuse>=3.0.0",
    "anthropic>=0.40.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]
