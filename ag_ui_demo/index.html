<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>AG-UI Protocol Demo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin: 0; display: grid; grid-template-columns: 1.4fr 1fr;
    height: 100vh; background: #0f1115; color: #e6e6e6;
  }
  h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: #8a8f98; }
  .chat-col { display: flex; flex-direction: column; border-right: 1px solid #262a33; }
  .side-col { display: flex; flex-direction: column; overflow: hidden; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: #2d5fff; color: white; }
  .bubble.assistant { align-self: flex-start; background: #1c1f26; border: 1px solid #2a2f3a; }
  .tool-card { align-self: flex-start; max-width: 85%; background: #1a1f14; border: 1px solid #3a4a24; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .tool-card .name { color: #b7e07a; font-weight: 600; }
  .tool-card pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; color: #c9d1d9; }
  .tool-card .result { margin-top: 6px; color: #8fd3ff; }
  .interrupt-card { align-self: center; max-width: 90%; background: #2b1414; border: 1px solid #7a2a2a; border-radius: 10px; padding: 10px 14px; }
  .interrupt-card button { margin-top: 8px; margin-right: 8px; padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; }
  .interrupt-card .approve { background: #2f9e44; color: white; }
  .interrupt-card .deny { background: #c92a2a; color: white; }
  .input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #262a33; }
  .input-row input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #14161b; color: #eee; }
  .input-row button { padding: 10px 16px; border-radius: 8px; border: none; background: #2d5fff; color: white; cursor: pointer; }
  .input-row button:disabled { opacity: .5; cursor: not-allowed; }
  .state-panel { padding: 16px; border-bottom: 1px solid #262a33; }
  .state-panel pre { background: #14161b; padding: 10px; border-radius: 8px; font-size: 12px; }
  .log-panel { flex: 1; overflow-y: auto; padding: 16px; }
  .log-line { font-family: ui-monospace, Menlo, monospace; font-size: 11px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #24272e; word-break: break-all; }
  .log-line .type { color: #ffb454; font-weight: 700; }
  .log-line .time { color: #666; margin-right: 6px; }
</style>
</head>
<body>
  <div class="chat-col">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input id="input" placeholder="試試「台北天氣如何？」或「寄信給 alice@example.com 提醒她開會」" />
      <button id="send">送出</button>
    </div>
  </div>
  <div class="side-col">
    <div class="state-panel">
      <h2>Shared State (STATE_SNAPSHOT / STATE_DELTA)</h2>
      <pre id="state">{}</pre>
    </div>
    <div class="log-panel">
      <h2>Raw AG-UI Event Stream</h2>
      <div id="log"></div>
    </div>
  </div>

<script>
const threadId = crypto.randomUUID();
const messagesEl = document.getElementById("messages");
const stateEl = document.getElementById("state");
const logEl = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let state = {};
const textBubbles = new Map();   // messageId -> bubble element
const toolCards = new Map();     // toolCallId -> {el, nameEl, argsEl, resultEl, argsBuf}

function logEvent(evt) {
  const div = document.createElement("div");
  div.className = "log-line";
  const time = new Date().toLocaleTimeString();
  div.innerHTML = `<span class="time">${time}</span><span class="type">${evt.type}</span> ${escapeHtml(JSON.stringify(evt))}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "bubble " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderState() {
  stateEl.textContent = JSON.stringify(state, null, 2);
}

function applyJsonPatch(patch) {
  for (const op of patch) {
    const key = op.path.replace(/^\//, "");
    if (op.op === "replace" || op.op === "add") state[key] = op.value;
    else if (op.op === "remove") delete state[key];
  }
  renderState();
}

function ensureToolCard(toolCallId, name) {
  if (toolCards.has(toolCallId)) return toolCards.get(toolCallId);
  const el = document.createElement("div");
  el.className = "tool-card";
  el.innerHTML = `<span class="name">🔧 ${name}</span><pre class="args"></pre><div class="result"></div>`;
  messagesEl.appendChild(el);
  const card = { el, argsEl: el.querySelector(".args"), resultEl: el.querySelector(".result"), argsBuf: "" };
  toolCards.set(toolCallId, card);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return card;
}

function showInterrupt(interrupt) {
  const div = document.createElement("div");
  div.className = "interrupt-card";
  div.innerHTML = `
    <div>⏸ ${escapeHtml(interrupt.message || interrupt.reason)}</div>
    <button class="approve">允許</button>
    <button class="deny">拒絕</button>
  `;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  const finish = (approved) => {
    div.querySelectorAll("button").forEach(b => b.disabled = true);
    div.style.opacity = 0.6;
    resumeRun(interrupt.id, approved);
  };
  div.querySelector(".approve").onclick = () => finish(true);
  div.querySelector(".deny").onclick = () => finish(false);
}

async function consumeStream(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      const line = part.split("\n").find(l => l.startsWith("data: "));
      if (!line) continue;
      const evt = JSON.parse(line.slice(6));
      handleEvent(evt);
    }
  }
}

function handleEvent(evt) {
  logEvent(evt);
  switch (evt.type) {
    case "TEXT_MESSAGE_START":
      textBubbles.set(evt.messageId, addBubble("assistant", ""));
      break;
    case "TEXT_MESSAGE_CONTENT": {
      const bubble = textBubbles.get(evt.messageId);
      if (bubble) bubble.textContent += evt.delta;
      break;
    }
    case "TOOL_CALL_START": {
      const card = ensureToolCard(evt.toolCallId, evt.toolCallName);
      card.argsEl.textContent = "呼叫中…";
      break;
    }
    case "TOOL_CALL_ARGS": {
      const card = toolCards.get(evt.toolCallId);
      if (card) {
        card.argsBuf += evt.delta;
        card.argsEl.textContent = card.argsBuf;
      }
      break;
    }
    case "TOOL_CALL_END": {
      const card = toolCards.get(evt.toolCallId);
      if (card) card.resultEl.textContent = "等待結果…";
      break;
    }
    case "TOOL_CALL_RESULT": {
      const card = toolCards.get(evt.toolCallId);
      if (card) card.resultEl.textContent = "✅ " + evt.content;
      break;
    }
    case "STATE_SNAPSHOT":
      state = evt.snapshot;
      renderState();
      break;
    case "STATE_DELTA":
      applyJsonPatch(evt.delta);
      break;
    case "RUN_FINISHED":
      if (evt.outcome && evt.outcome.type === "interrupt") {
        evt.outcome.interrupts.forEach(showInterrupt);
      } else {
        setInputEnabled(true);
      }
      break;
    case "RUN_ERROR":
      addBubble("assistant", "⚠️ 錯誤：" + evt.message);
      setInputEnabled(true);
      break;
  }
}

function setInputEnabled(enabled) {
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
  if (enabled) input.focus();
}

async function startRun(userText) {
  setInputEnabled(false);
  const body = {
    threadId,
    runId: crypto.randomUUID(),
    messages: [{ id: crypto.randomUUID(), role: "user", content: userText }],
    tools: [],
    context: [],
    forwardedProps: null,
  };
  const res = await fetch("/agent", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  await consumeStream(res);
}

async function resumeRun(interruptId, approved) {
  const body = {
    threadId,
    runId: crypto.randomUUID(),
    messages: [],
    tools: [],
    context: [],
    forwardedProps: null,
    resume: [{ interruptId, status: "resolved", payload: { approved } }],
  };
  const res = await fetch("/agent", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  await consumeStream(res);
}

sendBtn.onclick = () => {
  const text = input.value.trim();
  if (!text) return;
  addBubble("user", text);
  input.value = "";
  startRun(text);
};
input.addEventListener("keydown", e => {
  if (e.key === "Enter") sendBtn.onclick();
});

renderState();
</script>
</body>
</html>
